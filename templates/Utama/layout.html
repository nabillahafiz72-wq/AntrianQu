<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>AntrianQu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
 * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 25px 50px;
    background-color: #c8d8d0;
}

.logo {
    font-size: 20px;
    font-weight: bold;
    color: #2f3e3e;
}

.login-btn {
    font-size: 18px;
    background-color: #2f3e3e;
    color: white;
    border: none;
    padding: 15px 30px;
    border-radius: 12px;
    cursor: pointer;
}

.hero {
    height: 90vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    background: linear-gradient(to right, #6fa394, #2f5d5a);
    color: white;
    text-align: center;
}

.hero h1 {
    font-size: 58px;
    margin-bottom: 10px;
}

.hero p {
    font-size: 22px;
    margin-bottom: 20px;
}

.start-btn {
    background-color: #c8d8d0;
    color: #2f3e3e;
    border: none;
    padding: 12px 25px;
    border-radius: 15px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

.start-btn:hover {
    background-color: #aabfb6;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #6ea08d, #2c4a4a);

    display: flex;
    flex-direction: column;
}

.container {
    background: #b9cec3;
    padding: 30px;
    border-radius: 20px;
    width: 600px;
    text-align: center;
}

h2 {
    margin-bottom: 20px;
}


.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}


.card {
    background: #203b3b;
    color: white;
    padding: 20px;
    border-radius: 12px;
    text-align: left;
    cursor: pointer;
    transition: 0.3s;
}

.card:hover {
    transform: scale(1.05);
    background: #2d5555;
}

.icon {
    font-size: 24px;
    margin-bottom: 10px;
}

.card h3 {
    margin: 5px 0;
}

.card p {
    font-size: 14px;
    color: #ccc;
}

.menu-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}
    </style>
</head>
