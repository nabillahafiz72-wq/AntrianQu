<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    background: linear-gradient(to bottom right, #6fa287, #24413a);
}

/* Container */
.login-container {
    width: 100%;
    display: flex;
    justify-content: center;
}

/* Card */
.card {
    background: #b9cec3;
    padding: 40px 50px;
    border-radius: 20px;
    width: 350px;
    text-align: center;
}

/* Icon */
.icon {
    font-size: 50px;
    margin-bottom: 10px;
    color: #e6e6e6;
}

/* Title */
.card h2 {
    margin-bottom: 20px;
    color: #2f3e3e;
}

/* Label */
label {
    display: block;
    text-align: left;
    margin-top: 10px;
    font-size: 14px;
}

/* Input */
input {
    width: 100%;
    padding: 12px;
    margin-top: 5px;
    border-radius: 10px;
    border: none;
    background: #e6e6e6;
    margin-bottom: 10px;
}

/* Button */
button {
    margin-top: 15px;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 20px;

    background: #6fa287;
    color: white;
    font-size: 16px;
    cursor: pointer;

    transition: 0.3s;
}

button:hover {
    background: #5a8d75;
}

/* Error */
.error {
    color: red;
    font-size: 14px;
    margin-bottom: 10px;
}
</style>

<div class="login-container">
    <div class="card">

        <div class="icon"><i class="bi bi-person-circle"></i></div>
        <h2>Log in</h2>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">

    <label>Username</label>
    <input type="text" name="username" required>

    <label>Password</label>
    <input type="password" name="password" required>

    <button type="submit">Login</button>

</form>

    </div>
</div>

</body>
</html>
