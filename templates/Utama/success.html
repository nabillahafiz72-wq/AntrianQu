
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <title>Layanan Berhasil</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Membuat background gradient hijau gelap sesuai gambar */
            background: linear-gradient(to bottom right, #6fa287, #24413a);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        .container {
            padding: 20px;
        }

        /* Styling ikon centang ganda menggunakan SVG */
        .icon {
            
            font-size: 60px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.1rem;
            opacity: 0.9;
            margin-bottom: 30px;
        }

        /* Styling tombol Selesai */
        .btn-selesai {
            background-color: #accabf;
            color: #1a332c;
            border: none;
            padding: 12px 60px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn-selesai:hover {
            background-color: #92b0a6;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">
            <i class="bi bi-check2-all"></i>
        </div>

        <h1>Layanan berhasil dipilih</h1>
        <p>Nomor antrian Anda telah diambil</p>

        <a href="/">
            <button class="btn-selesai">Selesai</button>
        </a>
    </div>
</body>
</html>
