<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <title>Tambah Data - AntrianQu</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body{
            display:flex;
            min-height:100vh;
            background:#315b51;
        }

       

        /* MAIN CONTENT */
        .main-content{
            flex:1;
            background:linear-gradient(135deg, #447a6d 0%, #25463f 100%);
            display:flex;
            flex-direction:column;
            align-items:center;
            padding:40px;
        }

        .page-title{
            color:white;
            font-size:2rem;
            margin-bottom:30px;
        }

        /* CARD */
        .form-card{
            background:white;
            width:500px;
            max-width:90%;
            border-radius:12px;
            padding:30px;
            box-shadow:0 4px 10px rgba(0,0,0,0.2);
        }

        .form-group{
            margin-bottom:20px;
        }

        .form-group label{
            display:block;
            margin-bottom:8px;
            font-weight:600;
            color:#333;
        }

        .form-control{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:1rem;
        }

        .form-control:focus{
            outline:none;
            border-color:#0cab4b;
        }

        .button-group{
            display:flex;
            justify-content:space-between;
            margin-top:25px;
        }

        .btn{
            padding:12px 20px;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-size:1rem;
            font-weight:600;
            text-decoration:none;
            display:inline-flex;
            align-items:center;
            gap:8px;
        }

        .btn-save{
            background:#0cab4b;
            color:white;
        }

        .btn-save:hover{
            background:#08913f;
        }

        .btn-back{
            background:#7f8c8d;
            color:white;
        }

        .btn-back:hover{
            background:#636e72;
        }
    </style>
</head>

<body>

    

    <!-- MAIN -->
    <div class="main-content">

        <h1 class="page-title">
            Tambah Data Antrian
        </h1>

        <div class="form-card">

            <form method="POST" action="/tambah">

                <div class="form-group">
                    <label>Nama Antrian</label>

                    <input type="text"
                           name="nama"
                           class="form-control"
                           placeholder="Masukkan nama antrian">
                </div>

                <div class="form-group">
                    <label>Awalan</label>

                    <input type="text"
                           name="awalan"
                           class="form-control"
                           placeholder="Contoh: A">
                </div>

                <div class="form-group">
                    <label>Tujuan</label>

                    <input type="text"
                           name="tujuan"
                           class="form-control"
                           placeholder="Contoh: Loket 1, Loket 2, Loket 3">
                </div>

                <div class="button-group">

                    <button type="submit" class="btn btn-save">
                        <i class="bi bi-check-circle-fill"></i>
                        Simpan
                    </button>

                    <a href="/admin_db1" class="btn btn-back">
                        <i class="bi bi-arrow-left-circle-fill"></i>
                        Kembali
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>
</html>
