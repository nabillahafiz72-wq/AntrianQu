<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <title>View Data - AntrianQu</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body{
            display:flex;
            min-height:100vh;
            background:#315b51;
        }

        
        /* MAIN */

        .main-content{
            flex:1;
            background:linear-gradient(135deg, #447a6d 0%, #25463f 100%);
            display:flex;
            flex-direction:column;
            align-items:center;
            padding:40px;
        }

        .page-title{
            color:white;
            font-size:2rem;
            margin-bottom:30px;
        }

        /* CARD */

        .view-card{
            width:500px;
            max-width:90%;
            background:white;
            border-radius:12px;
            padding:30px;
            box-shadow:0 4px 10px rgba(0,0,0,0.2);
        }

        .info-group{
            margin-bottom:20px;
        }

        .info-label{
            font-weight:bold;
            margin-bottom:8px;
            color:#333;
        }

        .info-value{
            background:#f5f5f5;
            padding:12px;
            border-radius:8px;
            color:#333;
        }

        .tujuan-item{
            margin-bottom:8px;
        }

        .btn-back{
            margin-top:25px;
            display:inline-flex;
            align-items:center;
            gap:8px;
            padding:12px 20px;
            background:#7f8c8d;
            color:white;
            text-decoration:none;
            border-radius:8px;
            font-weight:bold;
        }

    </style>
</head>

<body>

    

    <!-- MAIN -->

    <div class="main-content">

        <h1 class="page-title">
            Detail Data Antrian
        </h1>

        <div class="view-card">

            <div class="info-group">

                <div class="info-label">
                    Nama Antrian
                </div>

                <div class="info-value">
                    {{ data.nama }}
                </div>

            </div>

            <div class="info-group">

                <div class="info-label">
                    Awalan
                </div>

                <div class="info-value">
                    {{ data.awalan }}
                </div>

            </div>

            <div class="info-group">

                <div class="info-label">
                    Nama Tujuan
                </div>

                <div class="info-value">

                    {% for tujuan in data.tujuan %}

                        <div class="tujuan-item">
                            {{ tujuan }}
                        </div>

                    {% endfor %}

                </div>

            </div>

            <a href="/admin_db1" class="btn-back">
                <i class="bi bi-arrow-left-circle-fill"></i>
                Kembali
            </a>

        </div>

    </div>

</body>
</html>
